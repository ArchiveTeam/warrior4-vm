[package]
name = "warrior4-network-check"
version = "0.0.0"
edition = "2024"
description = "Checks the network for any possible packet inspection interference"
publish = false

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }
hickory-resolver = { version = "0.26.3", features = ["tokio", "tls-ring", "webpki-roots"] }
rand = "0.9.1"
reqwest = { version = "0.13.5", features = ["rustls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.53.1", features = ["rt", "net"]}
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.4"
